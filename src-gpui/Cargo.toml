[package]
name = "argus"
description = "Argus native desktop task manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
default-run = "argus"

[lib]
name = "argus_native"

[dependencies]
argus-core = { path = "../crates/argus-core" }
argus-service = { path = "../crates/argus-service" }
argus-app = { path = "../crates/argus-app" }
gpui-kit = { version = "=0.8.0", features = ["profiler"] }
anyhow = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
windows.workspace = true
raw-window-handle = "0.6"
smol = "2"
log = { version = "0.4", features = ["std"] }
base64 = "0.23.1"
minisign-verify = "0.3"
semver = "1"
sha2 = "0.11.1"
url = { version = "2", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "stream", "system-proxy"] }
futures-util = "0.3"
time = { version = "0.3", features = ["parsing", "local-offset"] }
rfd = "0.16"

[features]
default = []


[build-dependencies]
embed-resource = "3"
serde_json = "1"
