[package]
name = "argus"
description = "Argus — a fast, modern task manager for Windows"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "argus_lib"

[dependencies]
argus-core = { path = "../crates/argus-core" }
log = "0.4"
argus-service = { path = "../crates/argus-service" }
# The updater plugin's own: a kept installer and the signed release notes are
# checked the way it checks a download.
base64 = "0.22"
minisign-verify = "0.3"
semver = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2.10"
# Schannel instead of rustls: the system certificate store, including roots
# that corporate proxies install. No zip: the update is the NSIS installer itself.
tauri-plugin-updater = { version = "2.13", default-features = false, features = ["native-tls", "system-proxy"] }
webview2-com = "0.39"
windows = { workspace = true }

[build-dependencies]
tauri-build = { version = "2", features = [] }
