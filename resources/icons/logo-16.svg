  </g>
  <g fill="#cfd1d5" fill-opacity="0.15">
    <rect x="3" y="6" width="2" height="2" rx=".5"/>
    <rect x="3" y="9" width="2" height="2" rx=".5"/>
    <rect x="6" y="6" width="2" height="2" rx=".5"/>
    <rect x="6" y="9" width="2" height="2" rx=".5"/>
    <rect x="9" y="6" width="2" height="2" rx=".5"/>
    <rect x="12" y="6" width="2" height="2" rx=".5"/>
