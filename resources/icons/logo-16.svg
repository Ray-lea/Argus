  <rect x="1.5" y="1.5" width="13" height="13" rx="3" fill="none" stroke="#fff" stroke-opacity=".14"/>
  <g fill="#4cc2ff">
    <rect x="3" y="3" width="1" height="1"/>
    <rect x="12" y="9" width="2" height="2" rx=".5"/>
    <rect x="12" y="12" width="2" height="2" rx=".5"/>
  </g>
  <g fill="#cfd1d5" fill-opacity=".7">
    <rect x="5" y="3" width="1" height="1"/>
    <rect x="7" y="3" width="1" height="1"/>
  </g>
  <g fill="#cfd1d5">
    <rect x="3" y="12" width="2" height="2" rx=".5"/>
