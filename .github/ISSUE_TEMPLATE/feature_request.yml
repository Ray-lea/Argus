name: 功能建议 / Feature request
description: 提出新功能或改进现有功能 / Suggest a new feature or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem
      description: 当前的不便之处或使用场景。/ What is inconvenient now, or the situation it is for.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案 / Proposal
      description: 希望 Argus 如何处理；如有参考的软件或界面，请一并说明。/ How Argus should handle it; mention any software or interface to compare with.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案 / Alternatives
      description: 考虑过的其他做法，或目前的变通办法。/ Other approaches considered, or the current workaround.
  - type: textarea
    id: hardware
    attributes:
      label: 本机配置 / PC specifications
      description: |
        涉及硬件或性能的建议可填写此项。在“进程”页取消选中应用或进程，单击右侧“本机配置”标题旁的“复制配置为文字”按钮，将内容粘贴到此处。面板已收起时，先单击窗口右上角的详细信息面板按钮。
        For hardware or performance suggestions, deselect any app or process on the Processes page, click “Copy PC specifications as text” beside “This PC” in the right pane, and paste the result here. If the pane is hidden, open it with the details pane button at the top right of the window.
      placeholder: 旧版本无复制按钮时，可手动填写。/ Enter the specifications manually if the button is unavailable in an older version.
      render: text
    validations:
      required: false
