name: 功能建议
description: 提出新功能或改进现有功能
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前的不便之处或使用场景。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
      description: 希望 Argus 如何处理；如有参考的软件或界面，请一并说明。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案
      description: 考虑过的其他做法，或目前的变通办法。
