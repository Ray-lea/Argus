name: 功能建议 / Feature request
description: 建议新功能或改进现有功能 / Suggest a new feature or an improvement to a feature
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请搜索已有的 Issue。每份建议只写一个需求。功能失效或显示异常请使用“缺陷报告”；使用问题请在讨论区提问。可使用中文或英文。

        Search the existing issues first. Write one request in each issue. For a broken feature or a display problem, use "Bug report". Ask usage questions in Discussions. Write in Chinese or English.
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与当前困难 / Use case and problem
      description: 要完成什么任务？当前哪一步不便？涉及现有功能时，注明所在页面和 Argus 版本。/ What task do you want to do? Which step is difficult now? For an existing feature, give the page and the Argus version.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望效果 / Expected result
      description: 描述期望的操作和结果。实现思路可写在下一项。/ Describe the operation and the result that you expect. Put implementation ideas in the next field.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 参考与补充（选填）/ References and more information (optional)
      description: |
        可附参考软件、界面草图或演示，并说明参考哪一部分。也可写明当前的替代办法和相关环境，例如分辨率、缩放或硬件型号。附件可直接拖入此处。
        Add reference software, sketches or demos, and tell which part to use. You can also give the current workaround and the related environment, for example the resolution, the scaling or the hardware models. Drag attachments here.
