name: 缺陷报告 / Bug report
description: 功能失效、崩溃、卡死、显示异常或 Argus 资源占用过高 / A feature fails, Argus crashes or hangs, the display is wrong, or Argus uses too many resources
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请搜索已有的 Issue，包括已关闭的。每份报告只写一个问题。读数错误或缺失请使用“读数异常”。安全漏洞请按[安全策略](https://github.com/Ray-lea/Argus/security/policy)私下报告。可使用中文或英文。

        Search the open and closed issues first. Write one problem in each report. For a wrong or missing value, use "Incorrect reading". Report security vulnerabilities privately as the [security policy](https://github.com/Ray-lea/Argus/security/policy) tells. Write in Chinese or English.
  - type: textarea
    id: description
    attributes:
      label: 问题现象 / What happened
      description: |
        写明实际结果和期望结果，保留完整的错误提示和错误码。崩溃或卡死时，注明是 Argus 退出、仅 Argus 无响应、整机冻结还是蓝屏，以及能否自行恢复。
        Give the actual result and the expected result. Include the full error message and error code. For a crash or hang, tell if Argus closed, only Argus stopped responding, Windows froze or a blue screen occurred. Tell if the system recovered automatically.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 发生经过 / Steps and frequency
      description: |
        写明当时的页面、操作和发生频率。窗口问题请注明打开 Argus 的方式（程序、快捷键、托盘或任务栏图标）和此前的窗口状态。偶发、冻结或蓝屏问题请描述上一次的经过，不要为填写此表再次触发。
        Give the page, the actions and the frequency. For a window problem, tell how Argus was opened (executable, shortcut, tray or taskbar icon) and the previous window state. For an intermittent problem, a freeze or a blue screen, describe the last occurrence. Do not cause the problem again to complete this form.
      placeholder: |
        频率 / Frequency: 每次 / 偶发 / 仅一次 — Every time / Sometimes / Once
        窗口状态 / Window state: 显示 / 最小化 / 托盘 — Visible / Minimized / In tray
        升级后出现时，此前正常的版本 / If it started after an update, last version that worked:
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 诊断信息 / Diagnostic information
      description: |
        在“关于”页单击“复制诊断信息”，然后粘贴到此处。旧版本没有此按钮；Argus 无法启动时，请按占位文字填写，未知项写“不确定”。版本可在 argus.exe 的“属性 → 详细信息”中查看；Windows 版本可运行 winver 查看。
        On the About page, click "Copy diagnostic information" and paste the result here. Older versions do not have this button. If Argus cannot start, enter the items that the placeholder shows, and write "Not sure" for unknown items. Find the version in argus.exe → Properties → Details. Run winver to find the Windows version.
      placeholder: |
        Argus 完整版本 / Full Argus version: 0.5.0+800.g123abcd
        Windows 版本 / Windows version: Windows 11 24H2 (26100.4061)
        安装方式 / Installation: 安装版 / 免安装版 / 从源码构建 — Installed / Portable / Built from source
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 补充环境（选填）/ Additional environment (optional)
      description: |
        补充诊断信息以外的相关内容：

        - 显示：多显示器、远程桌面、HDR 或显卡控制面板的设置。
        - 资源占用：进程名称、指标、测量工具、读数和持续时间。
        - 其他软件或设备：名称、版本或型号，例如安全软件或 USB 设备。

        旧版本可在“进程”页取消选中，在详细信息面板单击“复制配置为文字”，粘贴硬件配置。

        Add related information that the diagnostic information does not include:

        - Display: multiple monitors, Remote Desktop, HDR or graphics control panel settings.
        - Resource use: process name, metric, measurement tool, value and duration.
        - Other software or devices: name, version or model, for example security software or USB devices.

        In older versions, clear the selection on the Processes page. Then click "Copy PC specifications as text" in the details pane and paste the hardware details.
  - type: textarea
    id: logs
    attributes:
      label: 日志与附件（选填）/ Logs and attachments (optional)
      description: |
        在“关于”页单击“打开日志文件夹”。Argus 无法启动时，在文件资源管理器地址栏输入 `%LOCALAPPDATA%\dev.argus.taskmanager\logs\diagnostics`。附上涵盖问题时间的 `argus.log` 和 `argus.1.log` 至 `argus.3.log`，注明问题时间和时区。替换系统任务管理器的问题另附 `taskmgr.log`；安装失败请附错误窗口给出的日志。
        崩溃、冻结或蓝屏请附同一时间的可靠性监视器记录（Win+R → `perfmon /rel`）、事件来源与 ID、停止代码和驱动文件名。截图、录屏和日志可直接拖入此处。提交前请删除无关的账户名、设备标识和路径，保留错误码和时间。

        On the About page, click "Open log folder". If Argus cannot start, enter `%LOCALAPPDATA%\dev.argus.taskmanager\logs\diagnostics` in the File Explorer address bar. Attach `argus.log` and the `argus.1.log` to `argus.3.log` files that include the time of the problem. Give the time and the time zone. For a Replace Task Manager problem, also attach `taskmgr.log`. For an installation failure, attach the log that the error window shows.
        For a crash, a freeze or a blue screen, attach the Reliability Monitor records from the same time (Win+R → `perfmon /rel`). Include the event sources and IDs, the stop code and the driver file names. Drag screenshots, recordings and logs here. Before you submit, remove unrelated account names, device identifiers and paths. Keep the error codes and times.
