# Publishes a GitHub release for a version tag created by `pnpm release`.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Tag matches the version files, the changelog and the update key
        run: node scripts/release.mjs verify "$GITHUB_REF_NAME"
      - name: Tag is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME 不在 main 上；用 git push --atomic origin main $GITHUB_REF_NAME 一起推送"
            exit 1
          }

  check:
    needs: verify
    uses: ./.github/workflows/check.yml

  publish:
    name: Build and publish
    needs: check
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # No dependency or build caches: release binaries come from a clean build.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0
      - name: Install Rust
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --no-self-update
          rustup default stable-x86_64-pc-windows-msvc
      - run: pnpm install --frozen-lockfile
      - name: Version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Builds the embedded task manager helpers, the native argus.exe and the
      # NSIS installer, and signs the installer for the in-app updater. Local
      # builds leave the updater artifacts off, so they need no key.
      - name: Install NSIS
        run: choco install nsis --version=3.13 -y --no-progress
      - name: Build
        env:
          ARGUS_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          ARGUS_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          node scripts/build.mjs --installer
          setup=$(ls target/release/bundle/nsis/*-setup.exe)
          cargo run --locked -p argus-update-signer -- "$VERSION" "$setup"

      # A secret that does not match the public key would ship an update that
      # every installed copy rejects.
      - name: Check the update signature
        run: |
          setup=$(ls target/release/bundle/nsis/*-setup.exe)
          node scripts/release.mjs check-signature "$VERSION" "$setup" "$setup.sig"

      # The update dialog shows only notes signed with the same key, bound to
      # the version like the installer.
      - name: Sign the release notes
        env:
          ARGUS_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          ARGUS_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          node scripts/release.mjs release-notes "$VERSION" release-notes.json
          cargo run --locked -p argus-update-signer -- "$VERSION" release-notes.json
          node scripts/release.mjs check-signature "$VERSION" release-notes.json release-notes.json.sig

      # PowerShell, not bash: Git Bash rewrites /S and /D=... into paths.
      - name: Install and uninstall silently
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = (Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1).FullName
          $dir = Join-Path $env:RUNNER_TEMP "argus-smoke"
          # Installed for all users (the runner is an administrator), so the entry is under HKLM.
          $key = "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Argus"
          $p = Start-Process $setup -ArgumentList "/S", "/D=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "安装程序退出码 $($p.ExitCode)" }
          foreach ($file in "argus.exe", "uninstall.exe") {
            if (-not (Test-Path (Join-Path $dir $file))) { throw "安装后缺少 $file" }
          }
          $entry = Get-ItemProperty $key
          if ($entry.DisplayVersion -ne $env:VERSION) { throw "卸载项的版本是 $($entry.DisplayVersion)" }
          if ($entry.Publisher -ne "Argus contributors") { throw "卸载项的发布者是 $($entry.Publisher)" }
          # The installed image updates through the installer. Administrator and
          # Task Manager copies count by their protected folders and records
          # (unit tests in src-gpui/src/updater.rs), which the runner cannot set up.
          function Assert-UpdateKind($exe, $expected) {
            $probe = Start-Process $exe -ArgumentList "--argus-updater-check" -WindowStyle Hidden -PassThru
            if (-not $probe.WaitForExit(30000)) { $probe.Kill(); throw "更新安装类型检查超时：$exe" }
            if ($probe.ExitCode -ne $expected) { throw "更新安装类型错误：$exe（$($probe.ExitCode)）" }
          }
          Assert-UpdateKind (Join-Path $dir "argus.exe") 0
          $copies = Join-Path $env:RUNNER_TEMP "argus-update-copies"
          New-Item -ItemType Directory -Path $copies -Force | Out-Null
          # A copy of the installed image elsewhere is not the installation.
          $copy = Join-Path $copies "argus-admin-$([guid]::NewGuid()).exe"
          Copy-Item (Join-Path $dir "argus.exe") $copy
          Assert-UpdateKind $copy 1
          # A nearby uninstaller must not turn the portable download into an
          # installed image. No probe opens a window or changes machine state.
          $portable = Join-Path $copies "argus-portable.exe"
          Copy-Item "target/release/argus.exe" $portable
          Assert-UpdateKind $portable 1
          Copy-Item (Join-Path $dir "uninstall.exe") (Join-Path $copies "uninstall.exe")
          Assert-UpdateKind $portable 1
          # The uninstaller hands over to a copy in %TEMP% and returns at once.
          Start-Process (Join-Path $dir "uninstall.exe") -ArgumentList "/S" -Wait
          $deadline = (Get-Date).AddSeconds(60)
          while ((Test-Path $key) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 1 }
          if (Test-Path $key) { throw "卸载后卸载项仍在" }
          if (Test-Path (Join-Path $dir "argus.exe")) { throw "卸载后 argus.exe 仍在" }

      - name: Collect assets
        run: |
          mkdir assets
          setup=$(ls target/release/bundle/nsis/*-setup.exe)
          cp "$setup" assets/
          cp target/release/argus.exe "assets/Argus_${VERSION}_x64.exe"
          (cd assets && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          # Update manifests; the beta channel also offers stable releases.
          node scripts/release.mjs manifest "$VERSION" "$setup" "$setup.sig" \
            release-notes.json release-notes.json.sig > manifest.json
          cat manifest.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release.mjs notes "$VERSION" > notes.md
          if [[ "$VERSION" == *-* ]]; then
            gh release create "$GITHUB_REF_NAME" assets/* --verify-tag --prerelease \
              --title "Argus $GITHUB_REF_NAME" --notes-file notes.md
            # Both channels read their manifest from the latest stable release.
            stable=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
            if [[ -z "$stable" ]]; then
              echo "::warning::还没有稳定版，测试版通道暂时收不到 $GITHUB_REF_NAME"
            else
              cp manifest.json beta.json
              gh release upload "$stable" beta.json --clobber
            fi
          else
            cp manifest.json latest.json
            cp manifest.json beta.json
            gh release create "$GITHUB_REF_NAME" assets/* latest.json beta.json --verify-tag \
              --title "Argus $GITHUB_REF_NAME" --notes-file notes.md
          fi
