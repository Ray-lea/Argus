name: Publish official website

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: argustask-website-production
  cancel-in-progress: false

jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: wrangler@4.156.2
      WRANGLER_SEND_METRICS: 'false'
    steps:
      # Before the build: production comes from main or a release tag only.
      - name: Deployment source and Cloudflare settings
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          case "$GITHUB_REF" in
            refs/heads/main | refs/tags/v*) ;;
            *)
              echo "::error::官网只从 main 或版本标签发布，当前为 $GITHUB_REF"
              exit 1
              ;;
          esac
          if [ "$HAS_TOKEN" != true ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::缺少 Secret CLOUDFLARE_API_TOKEN 或变量 CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.18.0
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/tests/website-deploy.test.mjs
      - run: pnpm site:build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARGUS_DOCS_DEV_REF: refs/remotes/origin/main
      - run: pnpm site:check

      # Files go out before the manifests and pages that link to them. Each step
      # checks the public result before the next one starts.
      - name: Publish download mirror
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node website/scripts/deploy.mjs downloads
          node website/scripts/verify.mjs downloads
      - name: Publish update manifests
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node website/scripts/deploy.mjs updates
          node website/scripts/verify.mjs updates
      - name: Publish website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node website/scripts/deploy.mjs site
          node website/scripts/verify.mjs site
      - name: Publish www redirect
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node website/scripts/deploy.mjs www
          node website/scripts/verify.mjs www
